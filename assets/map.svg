<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .g { stroke: #8b949e; }
    .f { fill: #8b949e; stroke: none; }
    .a { stroke: #d39b52; }
    .af { fill: #d39b52; stroke: none; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8b949e; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    .s { font-size: 11.5px; opacity: .8; }
  </style>

  <!-- brief: a compact dictionary -->
  <g stroke-width="2">
    <line class="g" x1="40" y1="44" x2="150" y2="44" stroke-width="3.2"/>
    <line class="g" x1="52" y1="62" x2="210" y2="62" opacity=".55"/>
    <line class="a" x1="52" y1="78" x2="190" y2="78" stroke-width="2.6"/>
    <line class="g" x1="52" y1="94" x2="172" y2="94" opacity=".55"/>
    <line class="g" x1="40" y1="118" x2="128" y2="118" stroke-width="3.2"/>
    <line class="g" x1="52" y1="136" x2="200" y2="136" opacity=".55"/>
    <line class="g" x1="52" y1="152" x2="160" y2="152" opacity=".55"/>
    <line class="g" x1="40" y1="176" x2="140" y2="176" stroke-width="3.2"/>
    <line class="g" x1="52" y1="194" x2="186" y2="194" opacity=".55"/>
  </g>
  <text class="t" x="40" y="228">brief</text>
  <text class="s" x="82" y="228">in context every turn</text>

  <!-- open -->
  <path class="a" d="M200 78 C 240 78, 252 78, 282 78" stroke-width="1.6" stroke-dasharray="1 5"/>
  <path class="a" d="M276 73 L283 78 L276 83" stroke-width="1.6"/>

  <!-- the opened entry -->
  <g stroke-width="2">
    <rect class="g" x="300" y="34" width="210" height="150" rx="10" opacity=".45" stroke-width="1.4"/>
    <line class="a" x1="320" y1="58" x2="470" y2="58" stroke-width="2.6"/>
    <line class="g" x1="320" y1="80" x2="488" y2="80" opacity=".55"/>
    <line class="g" x1="320" y1="96" x2="452" y2="96" opacity=".55"/>
    <line class="g" x1="320" y1="112" x2="474" y2="112" opacity=".55"/>
    <!-- history: an earlier, replaced version -->
    <line class="g" x1="320" y1="138" x2="430" y2="138" opacity=".3" stroke-dasharray="4 5"/>
    <line class="g" x1="320" y1="154" x2="402" y2="154" opacity=".3" stroke-dasharray="4 5"/>
  </g>
  <!-- related pages -->
  <g stroke-width="1.6">
    <path class="g" d="M360 184 L 344 210" opacity=".5"/>
    <path class="g" d="M420 184 L 420 210" opacity=".5"/>
    <circle class="g" cx="340" cy="216" r="6"/>
    <circle class="g" cx="420" cy="216" r="6"/>
  </g>
  <text class="t" x="446" y="220">open</text>
  <text class="s" x="446" y="236">on demand</text>

  <!-- evidence back to sources -->
  <g stroke-width="1.5" opacity=".7">
    <path class="g" d="M510 70 C 548 70, 548 60, 586 60" stroke-dasharray="1 5"/>
    <path class="g" d="M510 104 C 556 104, 552 146, 586 146" stroke-dasharray="1 5"/>
  </g>
  <g stroke-width="1.8">
    <path class="g" d="M590 30 h46 l14 14 v52 h-60 z"/>
    <path class="g" d="M636 30 v14 h14"/>
    <line class="g" x1="600" y1="56" x2="634" y2="56" opacity=".5"/>
    <line class="a" x1="600" y1="66" x2="640" y2="66" stroke-width="2.4"/>
    <line class="g" x1="600" y1="76" x2="628" y2="76" opacity=".5"/>
    <path class="g" d="M590 116 h46 l14 14 v52 h-60 z"/>
    <path class="g" d="M636 116 v14 h14"/>
    <line class="g" x1="600" y1="142" x2="630" y2="142" opacity=".5"/>
    <line class="a" x1="600" y1="152" x2="640" y2="152" stroke-width="2.4"/>
    <line class="g" x1="600" y1="162" x2="622" y2="162" opacity=".5"/>
  </g>
  <text class="t" x="590" y="228">sources</text>
  <text class="s" x="648" y="228">evidence</text>
</svg>
