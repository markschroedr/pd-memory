settle_after = "3h"
auto_sync = true
credentials_file = "credentials.env"

[workspace]
dir = "workspace"

[identity]
user_names = ["Your name"]

# OpenAI is the recommended default. Both models use one OPENAI_API_KEY.
# Verify account retention before setting retention_verified = true.
# Without ZDR, standard_store_false requires explicit data-owner approval.
[openai]
provider = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-6-luna"
service_tier = "flex"
retention_policy = "zero_data_retention"
retention_verified = false

[embeddings]
provider = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "text-embedding-3-small"
dimension = 1024

