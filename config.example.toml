settle_after = "3h"
auto_sync = true
credentials_file = "credentials.env"

[workspace]
dir = "workspace"

[identity]
user_names = ["Your name"]

# Defaults use OpenRouter for generation and embeddings, with ZDR-only routing.
# init verifies the live providers before declaring setup complete.
[openai]
retention_verified = true

[[sources]]
name = "notes"
adapter = "files"
path = "/path/to/notes"
kind = "document"
exclude = ["**/drafts/**"]

# Routes use the longest matching root; unrouted folders use their last name.
[[routes]]
root = "/path/to/project"
home = "project"
