# embedding_per_million = 0.004

[[sources]]
name = "notes"
adapter = "files"
path = "/path/to/notes"
kind = "document"
exclude = ["**/drafts/**"]

# Routes use the longest matching root; unrouted folders use their last name.
[[routes]]
root = "/path/to/project"
home = "project"
